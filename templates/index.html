<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misterio</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { width: min(42rem, calc(100% - 2rem)); margin: 4rem auto; }
    h1 { margin-bottom: .25rem; }
    p { color: GrayText; }
    form { display: grid; gap: 1rem; margin-top: 2rem; }
    label { display: grid; gap: .4rem; font-weight: 600; }
    textarea, select, button { font: inherit; }
    textarea, select { padding: .75rem; border: 1px solid GrayText; border-radius: .5rem; background: Canvas; color: CanvasText; }
    button { justify-self: start; padding: .7rem 1.1rem; border: 0; border-radius: .5rem; background: #6d28d9; color: white; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .7; }
    progress { width: 100%; height: .5rem; accent-color: #6d28d9; }
    .generation-status { display: grid; gap: .5rem; color: GrayText; }
    .generation-status[hidden] { display: none; }
    section { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid GrayText; }
    pre { white-space: pre-wrap; font: inherit; line-height: 1.6; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <main>
    <h1>Misterio</h1>
    <p>Выберите навык и опишите задачу.</p>

    <form method="post" id="generation-form">
      <label>
        Навык
        <select name="skill" required>
          {% for skill in skills %}
          <option value="{{ skill.id }}" {% if skill.id == selected_skill %}selected{% endif %}>{{ skill.id }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        Задача
        <textarea name="brief" rows="5" required>{{ brief }}</textarea>
      </label>
      <button type="submit" id="submit-button">Создать</button>
      <div
        class="generation-status"
        id="generation-status"
        role="status"
        aria-live="polite"
        hidden
      >
        <span>Генерируем результат — это может занять некоторое время…</span>
        <progress aria-label="Генерация результата"></progress>
      </div>
    </form>

    {% if error %}
    <section aria-live="polite">
      <h2>Ошибка</h2>
      <p class="error">{{ error }}</p>
    </section>
    {% endif %}

    {% if result is not none %}
    <section aria-live="polite">
      <h2>Результат</h2>
      <pre>{{ result }}</pre>
    </section>
    {% endif %}
  </main>
  <script>
    const form = document.querySelector("#generation-form");
    const submitButton = document.querySelector("#submit-button");
    const generationStatus = document.querySelector("#generation-status");

    form.addEventListener("submit", (event) => {
      if (form.dataset.submitting === "true") {
        event.preventDefault();
        return;
      }

      form.dataset.submitting = "true";
      form.setAttribute("aria-busy", "true");
      submitButton.disabled = true;
      submitButton.textContent = "Генерируем…";
      generationStatus.hidden = false;
    });
  </script>
</body>
</html>
