[project]
name = "misterio"
version = "0.1.0"
description = "Local content agent: skills + KB (pet)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-multipart>=0.0.20",
    "typer>=0.12",
    "uvicorn>=0.34",
]

[project.scripts]
misterio = "misterio.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "pytest>=8",
    "pytest-httpx>=0.35",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misterio"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["model_eval: calls the configured real LLM"]
