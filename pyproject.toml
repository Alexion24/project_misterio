[project]
name = "misterio"
version = "0.1.0"
description = "Local content agent: skills + KB (pet)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
]

[project.scripts]
misterio = "misterio.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misterio"]
